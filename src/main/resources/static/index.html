<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Risk Analyzer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: "Segoe UI", Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 120px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user {
            align-self: flex-end;
            background-color: #1e1e1e;
        }

        .bot {
            align-self: flex-start;
            background-color: #2a2a2a;
        }

        .input-wrapper {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #000;
            padding: 20px;
            border-top: 1px solid #222;
        }

        .input-container {
            max-width: 900px;
            margin: auto;
            display: flex;
            align-items: center;
            background-color: #111;
            border-radius: 30px;
            padding: 10px 15px;
        }

        textarea {
            flex: 1;
            resize: none;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 16px;
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
        }

        .send-btn {
            background-color: white;
            color: black;
            border: none;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s ease;
        }

        .send-btn:hover {
            background-color: #ddd;
            transform: scale(1.05);
        }

        .header {
            text-align: center;
            padding: 15px;
            font-size: 18px;
            font-weight: 500;
            border-bottom: 1px solid #111;
            background-color: #000;
        }
    </style>
</head>
<body>

<div class="header">
    AI Risk Analyzer
</div>

<div class="chat-container" id="chat"></div>

<div class="input-wrapper">
    <div class="input-container">
        <textarea id="description" rows="1"
            placeholder="Type your project description..."
            oninput="autoResize(this)"
            onkeydown="handleKey(event)"></textarea>

        <button class="send-btn" onclick="analyze()">➤</button>
    </div>
</div>

<script>

    function autoResize(textarea) {
        textarea.style.height = "auto";
        textarea.style.height = textarea.scrollHeight + "px";
    }

    function handleKey(event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            analyze();
        }
    }

    async function analyze() {
        const input = document.getElementById("description");
        const chat = document.getElementById("chat");
        const text = input.value.trim();

        if (!text) return;

        // User message
        const userMessage = document.createElement("div");
        userMessage.className = "message user";
        userMessage.innerText = text;
        chat.appendChild(userMessage);

        input.value = "";
        input.style.height = "auto";

        chat.scrollTop = chat.scrollHeight;

        // Temporary loading message
        const loading = document.createElement("div");
        loading.className = "message bot";
        loading.innerText = "Analyzing...";
        chat.appendChild(loading);
        chat.scrollTop = chat.scrollHeight;

        try {
            const response = await fetch("/api/risk", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(text)
            });

            const result = await response.text();

            loading.innerText = result;
            chat.scrollTop = chat.scrollHeight;

        } catch (error) {
            loading.innerText = "Error connecting to backend.";
        }
    }

</script>

</body>
</html>
